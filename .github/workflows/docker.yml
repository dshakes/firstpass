name: docker
# Build and publish the container image to GitHub Container Registry (GHCR).
# Uses the built-in GITHUB_TOKEN — no external credentials. After the first run:
#   docker pull ghcr.io/dshakes/firstpass:latest
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Surfaced here so the login step's `if` can test them; empty when unset, which is what
      # makes the whole thing fail open.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # BuildKit is pulled from Docker Hub, whose ANONYMOUS pull limit is what actually failed
      # runs here (registry-1.docker.io DeadlineExceeded) — not the build. Authenticating lifts
      # that limit substantially.
      #
      # Gated on the secret being present so this FAILS OPEN: with no credentials configured the
      # step simply skips and the build behaves exactly as before. A login step that hard-failed
      # on a missing secret would break every fork and every run before the secret is added —
      # and an earlier attempt to fix this flake by redirecting BuildKit to ghcr.io/moby/buildkit
      # (a mirror that does not exist, 403 on every tag) already turned an occasional timeout
      # into a 100% outage. Not twice.
      # Gate on `env`, not on `secrets`: the secrets context is not dependably available in a
      # step-level `if`, and a condition that silently evaluates false would leave this never
      # firing even once the credentials exist — a fix that looks applied and isn't.
      - name: Log in to Docker Hub (raises the anonymous pull limit)
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 for the rolling `latest` (fast); add emulated arm64 only for tagged
          # releases, where the slower cross-build is acceptable.
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
