<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Firstpass: cheap until proven otherwise. The cheapest model answers first, your gate checks the real output, and a pass is served while a fail escalates one rung. Measured on 974 real MBPP coding tasks: +15.2 points of quality over always-cheap with 0 of 974 tasks made worse, and 12% to 57% lower cost per success than always-top depending on the top rung (sonnet or opus).</title>
  <!-- Solid panel so text contrast holds on GitHub light and dark. -->
  <rect x="0" y="0" width="1000" height="380" rx="20" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="378" rx="19" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="500" y="76" text-anchor="middle" font-size="44" font-weight="800" fill="#f0f6fc">Cheap until proven otherwise.</text>
  <text x="500" y="108" text-anchor="middle" font-size="18" fill="#9ba7b4">Decide after the output exists, by checking it.</text>

  <!-- flow -->
  <g font-size="16" font-weight="700" text-anchor="middle">
    <rect x="60" y="146" width="210" height="64" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="165" y="174" fill="#f0f6fc">Cheapest model</text>
    <text x="165" y="195" font-size="13" font-weight="400" fill="#9ba7b4">answers first</text>

    <rect x="330" y="146" width="210" height="64" rx="12" fill="#161b22" stroke="#19e3b1" stroke-width="2"/>
    <text x="435" y="174" fill="#19e3b1">Your gate</text>
    <text x="435" y="195" font-size="13" font-weight="400" fill="#9ba7b4">tests, schema, judge</text>

    <rect x="650" y="132" width="290" height="40" rx="10" fill="#0f2a24" stroke="#19e3b1"/>
    <text x="795" y="158" fill="#19e3b1">pass: serve it</text>
    <rect x="650" y="184" width="290" height="40" rx="10" fill="#2d1b1b" stroke="#f2736b"/>
    <text x="795" y="210" fill="#f2736b">fail: escalate one rung, gate again</text>
  </g>
  <g stroke="#9ba7b4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M272 178 H326 M318 171 L326 178 L318 185"/>
    <path d="M542 178 H570 V152 H646 M638 145 L646 152 L638 159"/>
    <path d="M570 178 V204 H646 M638 197 L646 204 L638 211"/>
  </g>

  <!-- proof tiles -->
  <g text-anchor="middle">
    <rect x="60" y="252" width="430" height="92" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="275" y="296" font-size="38" font-weight="800" fill="#19e3b1">+15.2 points</text>
    <text x="275" y="318" font-size="13" fill="#9ba7b4">quality vs always-cheap; 0 of 974 MBPP tasks made worse</text>
    <text x="275" y="335" font-size="11" fill="#7d8896">haiku to opus ladder; the gate partly self-grades here</text>

    <rect x="510" y="252" width="430" height="92" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="725" y="296" font-size="38" font-weight="800" fill="#19e3b1">12% to 57%</text>
    <text x="725" y="318" font-size="13" fill="#9ba7b4">lower cost per success vs always-top (sonnet to opus top rung)</text>
    <text x="725" y="335" font-size="11" fill="#7d8896">always-top still wins raw success by 1 to 2 points</text>
  </g>
</svg>
