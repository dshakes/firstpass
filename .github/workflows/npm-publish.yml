name: npm-publish
# Publish the npm package via OIDC TRUSTED PUBLISHING — no token, no 2FA.
# cargo-dist generates the `firstpass-proxy` tarball as a release asset (npm is in
# `installers` but NOT `publish-jobs`); this job downloads it and pushes it to npm
# using the repo's OIDC identity.
#
# The package is UNSCOPED `firstpass-proxy`, matching the crate on crates.io, the
# Homebrew formula, and the binary. It is not `firstpass` because that name on npm
# belongs to an unrelated CLI published before this repo existed.
#
# TRIGGER: `workflow_run` after the "Release" workflow finishes — NOT `release:
# published`. A release created by GITHUB_TOKEN (which cargo-dist uses) does NOT
# fire the `release` event — GitHub suppresses token-created events to avoid
# recursion, so a `release`-triggered job silently never runs. `workflow_run` fires
# regardless, so npm auto-publishes on every stable release with no manual step.
#
# One-time npm setup (npmjs.com → the package → Trusted Publisher → GitHub Actions):
#   Organization or user : dshakes
#   Repository           : firstpass
#   Workflow filename    : npm-publish.yml
#   Environment name     : (leave blank)
#   Allowed actions      : npm publish
# Then the NPM_TOKEN secret can be deleted — OIDC replaces it.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.2)"
        required: true

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # Manual dispatch, or after a SUCCESSFUL Release run on a stable v* tag (skip
    # rc/prereleases, which carry a '-' suffix — mirrors cargo-dist's brew/npm policy).
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-')) }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upgrade npm to an OIDC-capable version (>= 11.5.1)
        run: npm install -g npm@latest && npm --version
      - name: Download the npm package tarball from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag }}
        run: |
          # workflow_run.head_branch is the tag for a tag-triggered Release; fall back
          # to the latest release if it isn't a resolvable tag.
          if [ -z "$TAG" ] || ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          echo "publishing npm for release: $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-npm-package.tar.gz' --dir .
          ls -la ./*-npm-package.tar.gz
      - name: Publish to npm
        # npm can't configure trusted publishing until the package EXISTS, so the
        # first publish needs a token (use a classic Automation token — it bypasses
        # 2FA). Once the package exists + a Trusted Publisher is configured, delete
        # the NPM_TOKEN secret and every future release publishes via OIDC (no token).
        #
        # Three auth failures are possible here and they look nearly identical in npm's
        # output while having completely different fixes: wrong TOKEN TYPE (EOTP — a
        # Publish token still wants a one-time password), a missing TRUSTED PUBLISHER
        # (OIDC with no token, package exists), and a package that does not exist yet
        # (OIDC cannot bootstrap one). Each is named explicitly below — the first two
        # have each already cost a release cycle here.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TARBALL="$(ls ./*-npm-package.tar.gz)"
          NAME="$(tar -xzOf "$TARBALL" --wildcards '*/package.json' 2>/dev/null | \
                  python3 -c 'import sys,json;print(json.load(sys.stdin)["name"])' || echo '?')"
          echo "publishing npm package: $NAME"

          if [ -n "$NPM_TOKEN" ]; then
            echo "bootstrap publish with NPM_TOKEN"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          else
            echo "OIDC trusted publishing (no token)"
            # A trusted publisher can only be configured for a package that already
            # EXISTS. Publishing a brand-new name via OIDC therefore cannot work, and
            # npm's error for it is opaque. Say so here instead of leaving whoever
            # reads this log to work it out from a 404.
            if ! curl -sfo /dev/null "https://registry.npmjs.org/$NAME"; then
              echo "::error::$NAME does not exist on npm yet, and OIDC trusted publishing \
          cannot bootstrap a new package — a trusted publisher can only be attached to a package \
          that already exists. Add an NPM_TOKEN secret (classic Automation token, bypasses 2FA) so \
          this first publish can create it, then configure the Trusted Publisher for $NAME on \
          npmjs.com and delete the secret again."
              exit 1
            fi
          fi
          # Capture rather than stream, so the failure can be classified. npm's auth errors
          # all look alike at a glance and each has a completely different remedy; the run
          # log is usually read by someone who has just been paged, not by someone holding
          # this file's history in their head.
          set +e
          out="$(npm publish "$TARBALL" --access public 2>&1)"
          rc=$?
          set -e
          echo "$out"
          [ $rc -eq 0 ] && exit 0

          if echo "$out" | grep -q 'EOTP'; then
            echo "::error::npm demanded a one-time password, which CI cannot answer. The \
          NPM_TOKEN secret is a Publish or granular token; only a CLASSIC AUTOMATION token bypasses \
          2FA. npmjs.com -> Access Tokens -> Generate New Token -> Classic Token -> Automation, then \
          re-set the secret and re-run this workflow with the same tag."
          # BEFORE the auth branch: republishing also returns E403, and matching that as an
          # authorization failure would report a broken Trusted Publisher to someone whose setup
          # is fine. The specific reading of an ambiguous error has to win over the general one.
          elif echo "$out" | grep -qiE 'E409|cannot publish over|already exists|previously published'; then
            echo "::error::$NAME at this version is already on npm. Nothing to do — npm forbids \
          republishing a version. Bump the version to publish again."
          elif [ -z "$NPM_TOKEN" ] && echo "$out" | grep -qiE 'ENEEDAUTH|E401|E403|need auth|must be logged in|not authorized|unable to authenticate|forbidden'; then
            echo "::error::$NAME exists on npm but this workflow was not authorized to publish it, \
          and no NPM_TOKEN is set — so the Trusted Publisher is almost certainly missing or does not \
          match. On npmjs.com -> $NAME -> Trusted Publisher, set organization/user 'dshakes', \
          repository 'firstpass', workflow filename 'npm-publish.yml', and leave the environment \
          BLANK. All four must match this workflow exactly, the filename included."
          else
            echo "::error::npm publish failed for $NAME (exit $rc) — see the output above."
          fi
          exit $rc
