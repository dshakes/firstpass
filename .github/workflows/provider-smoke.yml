# Provider live-smoke matrix: drive the REAL proxy, per provider, against the REAL endpoint.
#
# This is the evidence behind every "verified" provider badge: a provider row only counts as
# wire-verified when its job here goes green (tiny request, ~cents). Jobs self-skip when the
# secret isn't configured, so the workflow is safe to run on any fork — a skipped provider is
# reported as skipped, never as verified.
#
# Nightly + manual. Never runs on PRs (secrets + spend).
name: provider-smoke

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: anthropic
            model: anthropic/claude-haiku-4-5
            secret: ANTHROPIC_API_KEY
            toml: ""
          - provider: openai
            model: openai/gpt-4.1-mini
            secret: OPENAI_API_KEY
            toml: ""
          # A bring-your-own provider has no built-in price, and an unpriced rung is now
          # rejected at config parse (it would bank a $0.00 receipt). The values below are
          # nominal smoke placeholders, NOT a price reference — the smoke asserts a served
          # response and a receipt, never a cost figure.
          - provider: groq
            model: groq/llama-3.3-70b-versatile
            secret: GROQ_API_KEY
            toml: |
              [[provider]]
              id = "groq"
              dialect = "openai"
              base_url = "https://api.groq.com/openai"
              api_key_env = "GROQ_API_KEY"
              [[price]]
              model = "groq/llama-3.3-70b-versatile"
              input_per_mtok = 0.59
              output_per_mtok = 0.79
          - provider: deepseek
            model: deepseek/deepseek-chat
            secret: DEEPSEEK_API_KEY
            toml: |
              [[provider]]
              id = "deepseek"
              dialect = "openai"
              base_url = "https://api.deepseek.com"
              api_key_env = "DEEPSEEK_API_KEY"
              [[price]]
              model = "deepseek/deepseek-chat"
              input_per_mtok = 0.27
              output_per_mtok = 1.10
          - provider: openrouter
            model: openrouter/openai/gpt-4.1-mini
            secret: OPENROUTER_API_KEY
            toml: |
              [[provider]]
              id = "openrouter"
              dialect = "openai"
              base_url = "https://openrouter.ai/api"
              api_key_env = "OPENROUTER_API_KEY"
              [[price]]
              model = "openrouter/openai/gpt-4.1-mini"
              input_per_mtok = 0.40
              output_per_mtok = 1.60
          # Provider id `google`, not `gemini`: that is the id the built-in price table and
          # `firstpass onboard` both use, so this smoke exercises the config we actually ship.
          - provider: gemini
            model: google/gemini-3.5-flash-lite
            secret: GEMINI_API_KEY
            toml: |
              [[provider]]
              id = "google"
              dialect = "gemini"
              base_url = "https://generativelanguage.googleapis.com"
              api_key_env = "GEMINI_API_KEY"
    name: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        id: gate
        env:
          KEY: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.provider }}: secret ${{ matrix.secret }} not configured — skipped (NOT verified)"
            # A skipped job still reports GREEN, so the run summary read "5 of 6 providers
            # passing" while five of them had never placed a call. Say so where it is read.
            echo "| ${{ matrix.provider }} | \`${{ matrix.model }}\` | ⏭️ **skipped** — no \`${{ matrix.secret }}\` secret, NOT verified |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.skip == 'false'
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.skip == 'false'

      - name: Build proxy
        if: steps.gate.outputs.skip == 'false'
        run: cargo build -p firstpass-proxy --bins

      - name: Smoke ${{ matrix.provider }} through the enforcing proxy
        if: steps.gate.outputs.skip == 'false'
        env:
          PROVIDER_KEY: ${{ secrets[matrix.secret] }}
          KEY_ENV_NAME: ${{ matrix.secret }}
          MODEL: ${{ matrix.model }}
          EXTRA_TOML: ${{ matrix.toml }}
        run: |
          set -euo pipefail
          if bash scripts/provider-smoke.sh; then
            echo "| ${{ matrix.provider }} | \`${{ matrix.model }}\` | ✅ wire-verified (served + receipt) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ${{ matrix.provider }} | \`${{ matrix.model }}\` | ❌ **FAILED** against the real endpoint |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
