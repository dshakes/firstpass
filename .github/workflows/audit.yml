name: audit

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly — Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # NOTE: there is deliberately no cargo-deny job here. ci.yml runs `cargo-deny check all`
  # (licenses + advisories + bans + sources) on every PR — a strict superset of the
  # `check advisories` job this file used to duplicate. That job was also a Docker Hub pull,
  # and it is where CI failures were actually coming from: unauthenticated
  # registry-1.docker.io pulls timing out, not test or code problems.
  cargo-audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit

