name: pages
# Publish the docs/ landing site to GitHub Pages on push to main.
on:
  push:
    branches: [main]
    paths:
      ["docs/**", "llms.txt", "AGENTS.md", "README.md", "SPEC.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The agent-facing entry points live at the repo root, but Pages serves docs/ as the site
      # root — so /llms.txt would 404 for the very agents it's written for. Copy them in at
      # publish time (single source of truth stays at the root) and disable Jekyll so .md and
      # .txt are served verbatim instead of being converted or dropped.
      - name: Stage agent-readable entry points at the site root
        run: |
          touch docs/.nojekyll
          cp llms.txt AGENTS.md README.md SPEC.md docs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
