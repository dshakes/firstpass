<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>How a test suite becomes a Firstpass gate. The model's reply arrives as JSON on stdin. run-tests.py extracts the code from its Markdown fences, writes it to a temp directory with your test files, and runs your real command — pytest, jest or cargo test. Three outcomes: all tests pass, so the gate returns pass with score 1.0 and the answer is served; some tests fail, so it returns fail with the pass fraction as a graded score and the ladder escalates; or the runner itself is broken or missing, so it returns abstain rather than a fabricated verdict, because a broken gate that reports failure would escalate every request forever.</title>
  <defs>
    <marker id="gwArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A97A6"/>
    </marker>
  </defs>

  <rect width="1000" height="300" fill="#0B0E14"/>

  <!-- 1. candidate in -->
  <rect x="24" y="96" width="176" height="76" rx="10" fill="#10151d" stroke="#243244"/>
  <text x="112" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">model reply</text>
  <text x="112" y="145" text-anchor="middle" font-size="11.5" fill="#8A97A6">JSON on stdin</text>
  <text x="112" y="161" text-anchor="middle" font-size="11" fill="#8A97A6" font-family="ui-monospace, monospace">{"candidate": …}</text>

  <line x1="204" y1="134" x2="252" y2="134" stroke="#8A97A6" stroke-width="1.5" marker-end="url(#gwArrow)"/>

  <!-- 2. the wrapper -->
  <rect x="256" y="72" width="232" height="124" rx="10" fill="#10151d" stroke="#19E3B1"/>
  <text x="372" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#19E3B1">run-tests.py</text>
  <text x="372" y="121" text-anchor="middle" font-size="11.5" fill="#8A97A6">unfences the code</text>
  <text x="372" y="139" text-anchor="middle" font-size="11.5" fill="#8A97A6">writes it to a temp dir</text>
  <text x="372" y="157" text-anchor="middle" font-size="11.5" fill="#8A97A6">copies your tests in</text>
  <text x="372" y="178" text-anchor="middle" font-size="11" fill="#8A97A6" font-family="ui-monospace, monospace">--docker for no network</text>

  <line x1="492" y1="134" x2="540" y2="134" stroke="#8A97A6" stroke-width="1.5" marker-end="url(#gwArrow)"/>

  <!-- 3. your runner -->
  <rect x="544" y="96" width="168" height="76" rx="10" fill="#10151d" stroke="#243244"/>
  <text x="628" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">your command</text>
  <text x="628" y="146" text-anchor="middle" font-size="11" fill="#8A97A6" font-family="ui-monospace, monospace">pytest · jest · cargo</text>
  <text x="628" y="163" text-anchor="middle" font-size="11.5" fill="#8A97A6">unchanged</text>

  <!-- fan out to three verdicts -->
  <path d="M 716 120 L 762 58" stroke="#8A97A6" stroke-width="1.5" fill="none" marker-end="url(#gwArrow)"/>
  <path d="M 716 134 L 762 134" stroke="#8A97A6" stroke-width="1.5" fill="none" marker-end="url(#gwArrow)"/>
  <path d="M 716 148 L 762 210" stroke="#8A97A6" stroke-width="1.5" fill="none" marker-end="url(#gwArrow)"/>

  <!-- pass -->
  <rect x="766" y="30" width="210" height="56" rx="10" fill="#04140f" stroke="#19E3B1"/>
  <text x="782" y="53" font-size="13" font-weight="600" fill="#5EEACB">pass · score 1.00</text>
  <text x="782" y="72" font-size="11.5" fill="#8A97A6">all tests green → serve it</text>

  <!-- fail, graded -->
  <rect x="766" y="106" width="210" height="56" rx="10" fill="#1a0808" stroke="#FF5C5C"/>
  <text x="782" y="129" font-size="13" font-weight="600" fill="#FF5C5C">fail · score 0.67</text>
  <text x="782" y="148" font-size="11.5" fill="#8A97A6">2 of 3 passed → escalate</text>

  <!-- abstain -->
  <rect x="766" y="182" width="210" height="56" rx="10" fill="#10151d" stroke="#8A97A6"/>
  <text x="782" y="205" font-size="13" font-weight="600" fill="#E6EDF3">abstain</text>
  <text x="782" y="224" font-size="11.5" fill="#8A97A6">runner missing or timed out</text>

  <!-- the two load-bearing notes -->
  <text x="24" y="242" font-size="11.5" fill="#8A97A6">
    <tspan font-weight="600" fill="#5EEACB">Graded, not binary.</tspan>
    <tspan> The score is the pass fraction, so conformal calibration has a distribution to threshold on — a bare pass/fail gives it two points.</tspan>
  </text>
  <text x="24" y="266" font-size="11.5" fill="#8A97A6">
    <tspan font-weight="600" fill="#E6EDF3">Abstain, never guess.</tspan>
    <tspan> A broken runner reported as </tspan>
    <tspan font-style="italic">fail</tspan>
    <tspan> would fail every candidate, escalate every request, and bill the top rung forever while looking healthy.</tspan>
  </text>
  <text x="24" y="288" font-size="11" fill="#3a4a5e">scripts/gates/run-tests.py — recipes for pytest, jest and cargo test in scripts/gates/README.md</text>
</svg>
